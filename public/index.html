<title>Çiftlik Vadisi</title>

<style>
/* Layout: tek sütun dikey sahne (460x1130 mantıksal birim), tüm oyun tuvalde çizilir, arayüz ahşap tabelalarla üstüne biner.
   Tek görünüm: oyun kendi ışığında geçer, bu yüzden koyu/açık tema ayrımı yok. */
:root{
  color-scheme: dark;
  --ground:#2a5d26;
  --wood-hi:#b0794c;
  --wood-mid:#7d4d2d;
  --wood-lo:#5a361d;
  --wood-edge:#3a2112;
  --cream:#fff1c6;
  --gold:#ffd23f;
  --red-1:#f2504a;
  --red-2:#b3201a;
  --blue-1:#5bb4ff;
  --blue-2:#1f6cd0;
  --font-display:'Lilita One','Trebuchet MS',system-ui,sans-serif;
  --font-body:'Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--ground);
  color:#fff;
  font-family:var(--font-body);
  padding:0;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;
}
button{font-family:inherit;cursor:pointer;border:0;padding:0;background:none;color:inherit}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
#wrap{margin:0 auto;width:100%}
#frame{position:relative;margin:0 auto;overflow:hidden;background:#6cbf3c}
#stage{position:absolute;left:0;top:0;width:460px;height:2380px;transform-origin:0 0}
#cv{display:block;width:460px;height:2380px;touch-action:pan-y}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto;position:absolute}
.wood{
  background:
    repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 2px,transparent 2px 11px),
    linear-gradient(180deg,var(--wood-hi) 0%,var(--wood-mid) 42%,var(--wood-lo) 100%);
  border:3px solid var(--wood-edge);
  border-radius:11px;
  box-shadow:inset 0 2px 0 rgba(255,225,175,.4),inset 0 -3px 0 rgba(0,0,0,.28),0 4px 0 rgba(0,0,0,.28),0 9px 14px rgba(0,0,0,.28);
}
.slot{background:#46281a;border-radius:8px;box-shadow:inset 0 3px 5px rgba(0,0,0,.55),0 1px 0 rgba(255,220,170,.25)}
.num{font-family:var(--font-display);color:#f6ead0;text-shadow:0 2px 0 rgba(0,0,0,.55);letter-spacing:.3px}
.ico{display:inline-block;flex:none}
.ico svg{display:block;width:100%;height:100%;overflow:visible}
.btn{
  font-family:var(--font-display);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.45);
  border-radius:11px;border:3px solid;letter-spacing:.4px;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.2),0 4px 0 rgba(0,0,0,.35);
  transition:transform .08s;
}
.btn:active{transform:translateY(3px);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 0 rgba(0,0,0,.2),0 1px 0 rgba(0,0,0,.35)}
.btn.red{background:linear-gradient(180deg,var(--red-1),var(--red-2));border-color:#ffb8b0}
.btn.blue{background:linear-gradient(180deg,var(--blue-1),var(--blue-2));border-color:#1b4a94}
.btn.gold{background:linear-gradient(180deg,#ffe27a,#e8a315);border-color:#8a5a0a;color:#4a2a05;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.btn.off{filter:grayscale(.85) brightness(.85);opacity:.9}
.hudbtn{border-radius:12px;display:grid;place-items:center}
.mi{width:64px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:0;border-radius:14px;background:linear-gradient(90deg,rgba(40,24,12,0) 0%,rgba(40,24,12,.5) 100%)}
.mi .ico{width:36px;height:34px;margin-top:2px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.mi span.t{font-family:var(--font-display);font-size:12.5px;color:#ffe9a8;text-shadow:-1px -1px 0 #3a2112,1px -1px 0 #3a2112,-1px 1px 0 #3a2112,1px 1px 0 #3a2112,0 2px 0 #3a2112;margin-top:-1px}
.mi:active .ico{transform:scale(.92)}
.dot{position:absolute;right:6px;top:2px;width:14px;height:14px;border-radius:50%;background:#ff3b30;border:2px solid #fff;display:none}
.dot.on{display:block}
.sign{display:flex;flex-direction:column;gap:5px;padding:6px}
.row2{display:flex;align-items:center;gap:6px;height:22px;padding:0 6px}
#toast{
  position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);
  max-width:min(92vw,420px);padding:10px 16px;border-radius:14px;text-align:center;
  font-family:var(--font-display);font-size:16px;color:#fff3d0;letter-spacing:.3px;
  background:linear-gradient(180deg,#6d4228,#41240f);border:3px solid #2a1608;box-shadow:0 8px 20px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
#modal{position:fixed;inset:0;background:rgba(10,24,8,.62);display:none;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#modal.on{display:flex}
.panel{width:min(100%,400px);max-height:100%;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;animation:pop .2s ease-out}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
.phead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.phead h2{margin:0;font-family:var(--font-display);font-weight:400;font-size:26px;color:#ffe9a8;text-shadow:0 2px 0 rgba(0,0,0,.5);letter-spacing:.5px}
.x{width:38px;height:38px;border-radius:50%;font-family:var(--font-display);font-size:22px;line-height:1}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,241,198,.94);color:#3a2112;border-radius:12px;padding:9px 10px;border:2px solid #c9a766;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.item .ic{width:42px;height:42px;flex:none;display:grid;place-items:center;border-radius:10px;background:#e8d29b}
.item .tx{flex:1;min-width:0}
.item b{font-family:var(--font-display);font-weight:400;font-size:18px;display:block;line-height:1.1}
.item small{font-size:13px;font-weight:800;color:#6b4a2a;display:block;margin-top:2px}
.item .btn{min-width:84px;height:38px;font-size:17px;padding:0 10px}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8fe04a,#4cae2f)}
.note{font-size:14px;font-weight:800;color:#f6e3b8;text-align:center;line-height:1.35}
.seg{display:flex;gap:8px}
.fld{width:100%;box-sizing:border-box;height:38px;border-radius:10px;border:2px solid #3a2112;background:#fff6dc;color:#2a1608;font:800 14px Nunito,sans-serif;padding:0 10px;min-width:0}
.row{display:flex;gap:8px;align-items:center}.row .fld{flex:1}
.hst{font-weight:800;font-size:14px;line-height:1.35;text-align:center;min-height:19px}
.hlb{font-size:13px;font-weight:800;color:#f6e3b8;letter-spacing:.2px;margin:0 0 3px}
.seg .btn{flex:1;height:40px;font-size:17px}
.stat{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:15px;padding:6px 4px;border-bottom:1px dashed rgba(58,33,18,.3)}
.stat b{font-family:var(--font-display);font-weight:400;font-size:17px}
@media (prefers-reduced-motion:reduce){.panel{animation:none}#toast{transition:none}.btn{transition:none}}
</style>

          <div class="slot row2"><span class="ico" style="width:20px;height:20px" data-i="wheat"></span><span class="num" id="vRate" style="font-size:19px">0 / dk</span></div>

        <button class="wood" id="bHire" aria-label="Çiftçi tut" style="left:228px;top:450px;width:58px;height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0">
          <span class="ico" style="width:26px;height:26px" data-i="shovel"></span>
          <span class="num" id="vHire" style="font-size:13px;display:flex;align-items:center;gap:3px">150</span>
        </button>
        <span class="ico" style="left:216px;top:440px;width:30px;height:30px;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.4))" data-i="plus"></span>

        <!-- Hayvan tabelaları: JS ekler -->
        <!-- Yan menü -->
        <div id="menu" style="left:396px;top:508px;width:64px;display:flex;flex-direction:column;gap:3px">
          <button class="mi" data-m="market"><span class="ico" data-i="store"></span><span class="t">Market</span></button>
          <button class="mi" data-m="farm"><span class="ico" data-i="barn"></span><span class="t">Çiftlik</span></button>
          <button class="mi" data-m="quests" style="position:relative"><span class="ico" data-i="clip"></span><span class="t">Görevler</span><i class="dot" id="dotQ"></i></button>
          <button class="mi" data-m="friends"><span class="ico" data-i="people"></span><span class="t">Arkadaşlar</span></button>
          <button class="mi" data-m="pay"><span class="ico" data-i="wallet"></span><span class="t">Ödeme</span></button>
          <button class="mi" data-m="games"><span class="ico" data-i="pad"></span><span class="t">Oyunlar</span></button>
        </div>
      </div>
    </div>
  </div>
</div>

<script async src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
'use strict';
var W=460,H=2380,TAU=Math.PI*2;
var RM=false;try{RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function rngf(seed){var a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function $(id){return document.getElementById(id)}
var cv=$('cv'),ctx=cv.getContext('2d'),frame=$('frame'),stage=$('stage');
var S=1,DPR=1,SS=2,ready=false;

/* ---------- çizim yardımcıları ---------- */
function mk(w,h,fn,ss){var q=ss||SS;var c=document.createElement('canvas');c.width=Math.ceil(w*q);c.height=Math.ceil(h*q);var g=c.getContext('2d');g.scale(q,q);fn(g,w,h);return{cv:c,w:w,h:h,ax:0,ay:0}}
function lg(g,x0,y0,x1,y1,st){var q=g.createLinearGradient(x0,y0,x1,y1);st.forEach(function(s){q.addColorStop(s[0],s[1])});return q}
function rg(g,x0,y0,r0,x1,y1,r1,st){var q=g.createRadialGradient(x0,y0,r0,x1,y1,r1);st.forEach(function(s){q.addColorStop(s[0],s[1])});return q}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function dot(g,x,y,r,f){g.fillStyle=f;g.beginPath();g.arc(x,y,r,0,TAU);g.fill()}
function sprite(s,x,y,k,rot,alpha){ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);if(k!==1)ctx.scale(k,k);if(alpha!=null)ctx.globalAlpha=alpha;ctx.drawImage(s.cv,-s.ax,-s.ay,s.w,s.h);ctx.restore()}

/* ---------- paletler ---------- */
var PAL={
  oak:{line:'rgba(30,70,24,.5)',dark:'#3a6a22',mid:'#5c9a30',hi:'#86b83c',leafHi:'#a3cf52',leafLo:'#2c5420'},
  apple:{line:'rgba(30,70,24,.5)',dark:'#3d6e24',mid:'#609e32',hi:'#8cbd3e',leafHi:'#aad456',leafLo:'#2c5822'},
  blossom:{line:'rgba(190,96,130,.45)',dark:'#e57ba4',mid:'#f7a9c6',hi:'#ffdce8',leafHi:'#fff4f8',leafLo:'#d9709b'},
  pine:{line:'rgba(24,64,34,.5)',dark:'#285a2c',mid:'#3f8138',hi:'#68a846',leafHi:'#8fc65e'}
};

/* ---------- ağaç parçaları ---------- */
function canopyLayer(w,h,cx,cy,R,pal,r,n){
  return mk(w,h,function(c){
    var bl=[{x:cx,y:cy,r:R*.72}],i;
    for(i=0;i<n;i++){var a=i/n*TAU+r()*.6,d=R*(.5+r()*.12);bl.push({x:cx+Math.cos(a)*d,y:cy+Math.sin(a)*d*.9,r:R*(.37+r()*.1)})}
    bl.sort(function(a,b){return b.y-a.y});
    c.fillStyle=pal.line;
    bl.forEach(function(b){c.beginPath();c.arc(b.x,b.y,b.r+1.3,0,TAU);c.fill()});
    bl.forEach(function(b){c.fillStyle=rg(c,b.x-b.r*.36,b.y-b.r*.46,b.r*.1,b.x,b.y,b.r,[[0,pal.hi],[.5,pal.mid],[1,pal.dark]]);c.beginPath();c.arc(b.x,b.y,b.r,0,TAU);c.fill()});
    c.globalCompositeOperation='source-atop';
    for(i=0;i<52;i++){var a2=r()*TAU,d2=Math.sqrt(r())*R*.95,x=cx+Math.cos(a2)*d2,y=cy+Math.sin(a2)*d2*.9;
      c.globalAlpha=.55;c.fillStyle=(y<cy+R*.1)?pal.leafHi:pal.leafLo;c.beginPath();c.ellipse(x,y,2.6+r()*2.4,1.3+r()*1.2,r()*TAU,0,TAU);c.fill()}
    c.globalAlpha=1;
    c.fillStyle=rg(c,cx-R*.35,cy-R*.55,R*.1,cx+R*.1,cy+R*.3,R*1.35,[[0,'rgba(255,255,190,.24)'],[.55,'rgba(0,0,0,0)'],[1,'rgba(8,38,22,.3)']]);
    c.fillRect(0,0,w,h);
  });
}
function trunk(c,cx,top,base,wd){
  c.save();c.fillStyle=lg(c,cx-wd,0,cx+wd,0,[[0,'#a2714a'],[.55,'#744827'],[1,'#4a2c15']]);c.strokeStyle='rgba(80,48,24,.55)';c.lineWidth=1.2;c.lineJoin='round';
  c.beginPath();c.moveTo(cx-wd*.55,top);c.lineTo(cx+wd*.55,top);c.quadraticCurveTo(cx+wd*.5,base-8,cx+wd*1.2,base);c.lineTo(cx-wd*1.2,base);c.quadraticCurveTo(cx-wd*.5,base-8,cx-wd*.55,top);c.closePath();c.fill();c.stroke();c.restore();
}
function apple(c,x,y,r){
  c.fillStyle='rgba(0,0,0,.18)';c.beginPath();c.ellipse(x+.6,y+r*.9,r*.9,r*.35,0,0,TAU);c.fill();
  c.fillStyle='rgba(150,34,26,.7)';c.beginPath();c.arc(x,y,r+.7,0,TAU);c.fill();
  c.fillStyle=rg(c,x-r*.35,y-r*.4,r*.1,x,y,r,[[0,'#ff8a78'],[.45,'#e5301f'],[1,'#a3150f']]);c.beginPath();c.arc(x,y,r,0,TAU);c.fill();
  c.fillStyle='rgba(255,255,255,.85)';c.beginPath();c.ellipse(x-r*.4,y-r*.45,r*.28,r*.17,-.6,0,TAU);c.fill();
  c.strokeStyle='#4a2c15';c.lineWidth=1.1;c.beginPath();c.moveTo(x,y-r*.7);c.lineTo(x+.8,y-r*1.3);c.stroke();
  c.fillStyle='#4fae35';c.beginPath();c.ellipse(x+2.2,y-r*1.1,2.1,1.1,-.4,0,TAU);c.fill();
}
function flower(c,x,y,r,petal,center){
  c.fillStyle='rgba(0,0,0,.14)';c.beginPath();c.ellipse(x+.5,y+r*.7,r*1.1,r*.45,0,0,TAU);c.fill();
  for(var i=0;i<5;i++){var a=i/5*TAU-1.57;c.fillStyle=petal;c.strokeStyle='rgba(120,40,70,.35)';c.lineWidth=.7;c.beginPath();c.arc(x+Math.cos(a)*r*.78,y+Math.sin(a)*r*.78,r*.62,0,TAU);c.fill();c.stroke()}
  dot(c,x,y,r*.5,center);
}
function oakSprite(kind,seed){
  var r=rngf(seed),R=30,w=88,h=96,cx=w/2,cy=R+8,base=h-4;
  var pal=kind==='blossom'?PAL.blossom:kind==='apple'?PAL.apple:PAL.oak;
  var can=canopyLayer(w,h,cx,cy,R,pal,r,9);
  var s=mk(w,h,function(c){
    c.fillStyle='rgba(20,60,20,.3)';c.beginPath();c.ellipse(cx+5,base,R*.85,6.5,0,0,TAU);c.fill();
    trunk(c,cx,cy+R*.3,base,6.2);
    c.drawImage(can.cv,0,0,w,h);
    var i,a,d,x,y;
    if(kind==='apple'){
      var P=[[-13,-2],[8,-8],[15,5],[-4,8],[-17,10],[3,-16],[-9,-14],[20,-6],[9,15]];
      P.slice(0,6).forEach(function(p){apple(c,cx+p[0]+(r()-.5)*3,cy+p[1]+(r()-.5)*3,4.2)});
      for(i=0;i<1;i++){a=r()*TAU;d=r()*R*.7;flower(c,cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,3,'#fff','#ffd23f')}
    }else if(kind==='blossom'){

  tri.forEach(function(n){[-6,6].forEach(function(dt){var o=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();o.type='triangle';o.frequency.value=mf(n);o.detune.value=dt;fl.type='lowpass';fl.frequency.value=900;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.7);g.gain.setValueAtTime(vol,t+d-.6);g.gain.exponentialRampToValueAtTime(.0001,t+d+.2);
    o.connect(fl);fl.connect(g);g.connect(MB);o.start(t);o.stop(t+d+.25)})});
}
function kick(t,v){var o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(48,t+.14);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(MB);o.start(t);o.stop(t+.24)}
function mSchedule(step,t){
  var bar=Math.floor(step/8)%NBARS,e=step%8,sec=Math.floor(bar/8),ch=CHORDS[bar],root=ch[0],tri=ch[1],row=MEL[bar],m=row[e];
  var hu=(Math.random()-.5)*.012,tt=t+hu;
  // gitar arpej
  var seq=[null,tri[0],tri[1],tri[2],null,tri[2],tri[1],tri[0]],av=sec===2?.2:.26;
  if(e===0)pluck(root,tt,.5);
  else if(e===4)pluck(root+7,tt,.36);
  else pluck(seq[e],tt,av*(e%2?.8:1));
  if(sec!==0&&e===0)mt(mf(root),t,.6,'sine',.2);
  // ezgi
  if(m){
    var f=mf(m),L=noteLen(row,e);
    if(sec===2){bell(f,t,.12);if(L>EIGHTH*1.5)flute(f,t,L*.9,.045)}
    else flute(f,t,L*.95,sec===0?.11:.14);
    if(sec===3&&e%4===0)bell(f*2,t+.02,.035);
  }
  // fon
  if(e===0&&sec>=1)pad(tri,t,8*EIGHTH,.03);
  if(sec===1||sec===3){if(e===0||e===4)kick(t,.15);if(e%2===1)mn(t,.05,7000,.02)}
  if(sec===0&&e===6)mn(t,.04,7500,.012);
}
function wantMusic(){return G.music!==false}
function startMusic(){
  if(musicOn||!wantMusic()||!actx())return;
  musicOn=true;
  if(!MB){MB=AC.createGain();MB.connect(MG);
    var cvb=AC.createConvolver(),nn=Math.floor(AC.sampleRate*1.8),ib=AC.createBuffer(2,nn,AC.sampleRate);
    for(var cc=0;cc<2;cc++){var dd=ib.getChannelData(cc);for(var ii=0;ii<nn;ii++)dd[ii]=(Math.random()*2-1)*Math.pow(1-ii/nn,2.6)}
    cvb.buffer=ib;var wet=AC.createGain();wet.gain.value=.3;MB.connect(cvb);cvb.connect(wet);wet.connect(MG)}
  var now=AC.currentTime;MB.gain.cancelScheduledValues(now);MB.gain.setValueAtTime(.0001,now);MB.gain.exponentialRampToValueAtTime(.55,now+2);
  mNext=now+.15;
  musicTimer=setInterval(function(){if(!AC)return;try{while(mNext<AC.currentTime+.4){mSchedule(mStep,mNext);mNext+=EIGHTH;mStep=(mStep+1)%(NBARS*8)}}catch(e){}},100);
}
function stopMusic(){
  if(!musicOn)return;musicOn=false;clearInterval(musicTimer);
  if(MB&&AC){var now=AC.currentTime;MB.gain.cancelScheduledValues(now);MB.gain.setValueAtTime(Math.max(.0001,MB.gain.value),now);MB.gain.linearRampToValueAtTime(.0001,now+.4)}
}

var OFF_MAX=12*3600,OFF_MIN=45;
function offlineApply(){
  var now=Date.now(),last=G.last||0;G.last=now;
  if(!last)return;
  var sec=Math.min(OFF_MAX,(now-last)/1000);if(sec<OFF_MIN)return;
  var gt=growTime(),yp=yieldPer(),n=G.plots.length;
  var perSec=Math.min(n/(gt+6),G.farmers/7);
  var made=Math.floor(sec*perSec)*yp,room=Math.max(0,capacity()-G.wheat),wheat=Math.min(made,room);
  G.wheat+=wheat;G.st.harv+=wheat;
  for(var i=0;i<n;i++){var pv=G.plots[i];if(pv>=0&&pv<1)G.plots[i]=Math.min(1,pv+sec/gt)}
  var coins=0,cash=0;
  var m=Math.round(sec/60),tm=m>=60?Math.floor(m/60)+' sa '+(m%60)+' dk':m+' dk',parts=[];
  if(wheat>0)parts.push('+'+fmtN(wheat)+' buğday');if(cash>0)parts.push('+'+fmtN(cash)+' nakit');if(coins>0)parts.push('+'+fmtN(coins)+' altın');
  if(!parts.length&&made>0)parts.push('Depo dolu');
  if(parts.length)setTimeout(function(){toast('Yokken ('+tm+'): '+parts.join(', '))},900);
  save();
}

/* çiftçi zekası */
function pickPlot(f){
  var best=-1,bd=1e9,pass,i;
  for(pass=0;pass<2&&best<0;pass++){
    for(i=0;i<24;i++){
      if(plotRes[i]!==null&&plotRes[i]!==f.id)continue;
      var ok=pass===0?G.plots[i]>=1:G.plots[i]<0;if(!ok)continue;
      var c=plotCenter(i),d=(c[0]-f.x)*(c[0]-f.x)+(c[1]-f.y)*(c[1]-f.y);if(d<bd){bd=d;best=i}
    }
  }
  return best;
}
function updFarmer(f,dt){
  if(f.state==='toTruck'){
    var tk=truck,tx=tk.x+16,ty=322,dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy),sp=125*dt;
    if(d<=sp+.5){f.x=tx;f.y=ty;f.state='board';f.at=0;f.dir=-1;SND.door()}
    else{f.x+=dx/d*sp;f.y+=dy/d*sp;f.ph+=dt*17;if(Math.abs(dx)>.5)f.dir=dx>0?1:-1}
    return;
  }
  if(f.state==='board'){f.at+=dt;if(f.at>=.5){f.state='inCab';SND.door()}return}
  if(f.state==='inCab')return;
  if(f.state==='idle'){
    f.wait-=dt;if(f.wait>0)return;
    var p=pickPlot(f);
    if(p>=0){plotRes[p]=f.id;f.target=p;f.act=G.plots[p]>=1?'harvest':'plant';f.state='walk'}
    else{f.wait=1.2+Math.random()*1.5;f.tx=96+Math.random()*170;f.ty=664+Math.random()*10;f.state='wander'}
    return;
  }
  if(f.state==='walk'||f.state==='wander'){
    var tx,ty;if(f.state==='walk'){var c=plotCenter(f.target);tx=c[0];ty=c[1]+11}else{tx=f.tx;ty=f.ty}
    var dx=tx-f.x,dy=ty-f.y,d=Math.hypot(dx,dy),sp=(f.state==='walk'?66:36)*dt;
    if(d<=sp+.5){f.x=tx;f.y=ty;if(f.state==='walk'){f.state='act';f.at=0}else{f.state='idle';f.wait=.6}}
    else{f.x+=dx/d*sp;f.y+=dy/d*sp;f.ph+=dt*(f.state==='walk'?13:8);if(Math.abs(dx)>.5)f.dir=dx>0?1:-1}
    return;
  }
  if(f.state==='act'){
    f.at+=dt;
    if(f.at>=(f.act==='harvest'?.7:.8)){
      var i=f.target;plotRes[i]=null;
      if(f.act==='harvest')doHarvest(i,true);else doPlant(i,true);
      f.state='idle';f.wait=.05;f.target=-1;
    }
  }
}

}

var truck={x:236,state:'park',timer:0,load:0,price:2,fl:0,dir:-1,wheel:0,driver:null,sm:0};
var ENG=null;
function engineStart(){
  if(!G.sound||!actx())return;
  try{
    if(ENG)engineStop(true);
    var t=AC.currentTime,o=AC.createOscillator(),o2=AC.createOscillator(),fl=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=92;o2.type='square';o2.frequency.value=46;
    fl.type='bandpass';fl.frequency.value=420;fl.Q.value=.7;
    var sg=AC.createGain();sg.gain.value=.5;o.connect(fl);o2.connect(sg);sg.connect(fl);fl.connect(g);g.connect(MG);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.3);
    o.start(t);o2.start(t);
    var E={o:o,o2:o2,g:g,mode:'run',rate:14,next:t+.05,iv:0,flt:fl};
    E.iv=setInterval(function(){
      if(!ENG||ENG!==E||!AC)return;
      try{while(E.next<AC.currentTime+.14){
        var w=E.next-AC.currentTime,run=E.mode==='run',k=Math.random();
        // gır: kısa testere vuruşu + tıkırtı
        tone((run?96:78)+k*14,.055,'sawtooth',run?.34:.26,Math.max(0,w),(run?60:50));
        noise(.045,run?1100:850,1.4,run?.26:.2,Math.max(0,w),'bandpass');
        if(Math.random()<.5)tone(190+k*30,.03,'square',.07,Math.max(0,w)+.012);
        E.next+=1/(run?E.rate:8.5)*(.92+Math.random()*.16);
      }}catch(e){}
    },45);
    ENG=E;
  }catch(e){ENG=null}
}
function engineMode(m){
  if(!ENG||!AC||ENG.mode===m)return;ENG.mode=m;var t=AC.currentTime,run=m==='run';
  try{ENG.o.frequency.setTargetAtTime(run?92:74,t,.2);ENG.o2.frequency.setTargetAtTime(run?46:37,t,.2);ENG.g.gain.setTargetAtTime(run?.16:.11,t,.2)}catch(e){}
}
function engineStop(now){
  if(!ENG)return;var E=ENG;ENG=null;clearInterval(E.iv);
  try{var t=AC.currentTime,d=now?.05:.45;E.g.gain.cancelScheduledValues(t);E.g.gain.setValueAtTime(Math.max(.0001,E.g.gain.value),t);E.g.gain.exponentialRampToValueAtTime(.0001,t+d);
    E.o.stop(t+d+.05);E.o2.stop(t+d+.05);
    if(!now){for(var i=0;i<4;i++){tone(70-i*8,.06,'sawtooth',.22-i*.04,i*.13,50);noise(.04,800,1.2,.14-i*.03,i*.13,'bandpass')}}}catch(e){}
}
function pickDriver(){
  var best=null;
  farmers.forEach(function(f){if(!best&&(f.state==='idle'||f.state==='wander'))best=f});
  if(!best)farmers.forEach(function(f){if(!best&&f.state==='walk')best=f});
  if(!best)best=farmers[0]||null;
  return best;
}
function startSell(){
  if(truck.state!=='park'){toast('Kamyon yolda...');SND.err();return}
  if(G.wheat<1){toast('Depoda satılacak buğday yok.');SND.err();return}
  truck.load=Math.floor(G.wheat);G.wheat-=truck.load;truck.price=sellPrice();truck.dir=-1;truck.fl=0;
  var f=pickDriver();truck.driver=f;
  if(f){if(f.target>=0&&plotRes[f.target]===f.id)plotRes[f.target]=null;f.target=-1;f.state='toTruck';f.act='';truck.state='boarding'}
  else{truck.state='toShop';engineStart();SND.horn()}
}
function truckRunning(){var st=truck.state;return st==='toShop'||st==='unload'||st==='back'}
function updTruck(dt){
  var tk=truck;
  if(!G.sound&&ENG)engineStop(true);
  if(tk.state==='boarding'){if(!tk.driver||tk.driver.state==='inCab'){tk.state='toShop';engineStart();SND.horn()}}
  else if(tk.state==='toShop'){tk.x-=56*dt;tk.wheel+=dt*7.5;if(tk.x<=140){tk.x=140;tk.state='unload';tk.timer=0;SND.brake();engineMode('idle')}}
  else if(tk.state==='unload'){
    tk.timer+=dt;tk.fl+=dt;
    if(tk.fl>.13&&tk.timer<1.45){tk.fl=0;flyers.push({x0:tk.x+44,y0:276,x1:66,y1:318,t:0,dur:.5,v:0,sm:true})}
    if(tk.timer>=1.9){
      var inc=Math.floor(tk.load*tk.price+1e-6),bonus=Math.floor(tk.load*3/80+1e-6);
      G.cash+=inc;G.coins+=bonus;G.st.sold++;
      popup(66,222,'+'+fmtN(inc),'#a6f070');if(bonus>0)popup(100,202,'+'+bonus+' altın','#ffe27a');
      burst(66,300,16,['#a6f070','#ffe27a','#fff'],60);SND.cash();tk.load=0;tk.state='back';tk.dir=1;engineMode('run');
    }
  }
  else if(tk.state==='back'){tk.x+=56*dt;tk.wheel-=dt*7.5;if(tk.x>=236){tk.x=236;tk.state='exit';tk.timer=0;tk.wheel=0;SND.brake();engineStop()}}
  else if(tk.state==='exit'){
    tk.timer+=dt;
    if(tk.timer>=.6){var f=tk.driver;tk.driver=null;tk.state='park';
      if(f&&farmers.indexOf(f)>=0){f.x=tk.x+16;f.y=322;f.dir=1;f.state='idle';f.wait=.25;f.target=-1;SND.door()}}
  }
  // egzoz dumanı
  if(truckRunning()||tk.state==='boarding'&&false){
    tk.sm-=dt;
    if(tk.sm<=0){tk.sm=tk.state==='unload'?.26:.13;var fl=tk.dir>0,px=fl?tk.x+2:tk.x+68;
      parts.push({t:'dot',x:px,y:305,vx:(fl?-1:1)*(6+Math.random()*6),vy:-12-Math.random()*8,life:.8,max:1,col:'#f1f1f4',r:1.8+Math.random()*1.4,g:-12})}
  }
}

  animals.forEach(function(a){updAnimal(a,dt)});
  updTruck(dt);
  // uçanlar
  for(var j=flyers.length-1;j>=0;j--){var f=flyers[j];f.t+=dt;if(f.t>=f.dur){if(!f.sm)beltItems.push({y:566,v:f.v});flyers.splice(j,1)}}
  // bant
  for(var b=beltItems.length-1;b>=0;b--){var it=beltItems[b];it.y-=70*dt;if(it.y<=404){deliver(it.v);beltItems.splice(b,1)}}
  barnPulse=Math.max(0,barnPulse-dt*3);
  updPlay(dt);
  for(var rp=ripples.length-1;rp>=0;rp--){ripples[rp].t+=dt;if(ripples[rp].t>1.3)ripples.splice(rp,1)}
  // yumurtalar
  for(var e=eggs.length-1;e>=0;e--){var eg=eggs[e];eg.age+=dt;if(eg.age>20){var dn=DEF[eg.k],v=Math.max(1,Math.round(dn.val/4));if(dn.cur==='coins'){G.coins+=v}else{G.cash+=v}popup(eg.x,eg.y-10,'+'+v,'#ffe27a');eggs.splice(e,1)}}
  // parçacıklar
  for(var q=parts.length-1;q>=0;q--){var pt=parts[q];pt.life-=dt;if(pt.life<=0){parts.splice(q,1);continue}pt.x+=pt.vx*dt;pt.y+=pt.vy*dt;if(pt.g)pt.vy+=pt.g*dt;if(pt.t==='petal'){pt.rot+=dt*2;pt.vx=Math.sin(T*2+pt.rot)*14}}
  petalT-=dt;if(petalT<=0&&!RM){petalT=.9;var bs=blossomSpots;if(bs.length){var s=bs[Math.floor(Math.random()*bs.length)];parts.push({t:'petal',x:s.x+(Math.random()-.5)*26,y:s.y-40*s.k,vx:0,vy:16+Math.random()*10,life:3.4,max:3.4,col:Math.random()<.5?'#ffd3e2':'#fff',rot:Math.random()*6})}}
  // kelebekler
  butter.forEach(function(b){b.x=b.cx+Math.sin(T*.5+b.ph)*b.rad;b.y=b.cy+Math.sin(T*1.1+b.ph*2)*b.rad*.55});
  // hasat/dk
  var cut=T-60,tot=0;while(harvLog.length&&harvLog[0].t<cut)harvLog.shift();harvLog.forEach(function(h){tot+=h.v});G._rate=tot;
  saveT+=dt;if(saveT>5){saveT=0;save()}
  uiT-=dt;if(uiT<=0){uiT=.15;refreshUI()}
}

function refreshUI(){
  $('vCash').textContent=fmtN(G.cash);$('vCoin').textContent=fmtN(G.coins);
  $('vStock').textContent=fmtN(G.wheat);$('vStockBar').style.width=Math.min(100,G.wheat/capacity()*100)+'%';
  $('vFarmers').textContent=G.farmers;$('vRate').textContent=Math.round(G._rate||0)+' / dk';
  var maxF=G.farmers>=MAXF;$('vHire').textContent=maxF?'Dolu':STAR_AMT+' ⭐';
  var sellOff=truck.state!=='park'||G.wheat<1;$('bSell').classList.toggle('off',sellOff);
  ANI.forEach(function(d){
    var n=cnt(d.k),t=$('t_'+d.k),p=$('p_'+d.k),b=$('b_'+d.k),cs=aCost(d);
    if(n>=d.max){t.textContent=d.name+' '+n+'/'+d.max;p.textContent='Dolu';b.classList.add('off')}
    else{
      var early=!!SRV.unl[d.k.toUpperCase()],lock=dayNum()<UNLOCK_DAY[d.k]&&!early,canEarly=lock&&!!d.big&&!!(TGW&&TGW.openInvoice&&TGW.initData),needStar=!!(STAR_ITEM[d.k]&&!SRV.unl[d.k]&&n===0);
      t.textContent=lock?'Kilitli · Gün '+UNLOCK_DAY[d.k]:(n>0?d.name+' '+n+'/'+d.max:'Satılık');
      {p.innerHTML=fmtN(cs)+' <span class="ico" style="width:17px;height:17px" data-i="coin"></span>';injectIcons(p)}
      var bl=canEarly?'Erken '+earlyPrice(d.k)+'⭐':((needStar&&!lock)?'Al +'+STAR_COST[d.k]+'⭐':'Al');if(b.textContent!==bl){b.textContent=bl;b.style.fontSize=(canEarly||(needStar&&!lock))?'15px':'19px'}
      b.classList.toggle('off',(lock&&!canEarly)||G.coins<cs)}
  });
  $('bHire').style.filter=maxF?'grayscale(.7) brightness(.85)':'none';
  var claimable=questList().some(function(q){return !G.q[q.id]&&q.cur>=q.goal});$('dotQ').classList.toggle('on',claimable);
}

function animalSound(k,v){if(k==='c')SND.cluck(v);else if(k==='d')SND.quack();else if(k==='s')SND.baa(v);else if(k==='p')SND.buzz();else if(k==='z')SND.oink();else if(k==='e')SND.baa(1.35);else if(k==='o')SND.honk();else if(k==='t')SND.gobble();else SND.moo()}
function buyAnimal(k){
  var d=DEF[k],n=cnt(k);if(n>=d.max)return;
  var day=dayNum();if(day<UNLOCK_DAY[k]&&!SRV.unl[k.toUpperCase()]){if(d.big&&TGW&&TGW.openInvoice&&TGW.initData){var c0=aCost(d);if(G.coins<c0){toast('Önce '+fmtN(c0)+' altın gerekli.');SND.err();return}starEarly(k);return}toast(d.name+' '+UNLOCK_DAY[k]+'. günde açılır (şu an '+day+'. gün).');SND.err();return}
  var c=aCost(d);if(G.coins<c){toast('Yetersiz altın: '+fmtN(c)+' gerekli.');SND.err();return}
  if(STAR_ITEM[k]&&!SRV.unl[k]&&n===0){
    if(!(TGW&&TGW.openInvoice&&TGW.initData)){toast(d.name+' yalnızca Telegram içinde '+STAR_COST[k]+' ⭐ ile açılır.');SND.err();return}
    starUnlock(k);return}
  buyAnimalDo(k);
}
var EARLY_AMT=200,EARLY_DIFF=50;
function earlyPrice(k){return SRV.unl[k]?EARLY_DIFF:EARLY_AMT}
function starEarly(k){
  if(starBusy)return;starBusy=true;var d=DEF[k],K=k.toUpperCase();toast('Ödeme ekranı hazırlanıyor...');
  function end(){starBusy=false}
  starPost('/api/invoice',{initData:TGW.initData,item:K}).then(function(r){
    if(r.status===409){starSync().then(function(){end();if(G.coins>=aCost(d)&&cnt(k)<d.max)buyAnimalDo(k)});return}
    if(r.status!==200||!r.j||!r.j.link){end();toast('Satın alma şu an kullanılamıyor.'+errTag(r));SND.err();return}
    TGW.openInvoice(r.j.link,function(st){
      if(st==='paid'){var n=0;toast('Ödeme alındı...');
        (function poll(){starSync().then(function(){
          if(SRV.unl[K]){end();if(G.coins>=aCost(d)&&cnt(k)<d.max)buyAnimalDo(k);else toast('Erken açıldı! Altının yetince '+d.name+' alabilirsin.')}
          else if(++n>=10){end();toast('Ödeme alındı ama henüz görünmedi. Biraz sonra tekrar dene.')}
          else setTimeout(poll,1500)})})();
      }else{end();toast(st==='cancelled'?'Ödeme iptal edildi.':st==='failed'?'Ödeme başarısız oldu.':'Ödeme bekleniyor...')}
    });
  }).catch(function(){end();toast('Bağlantı hatası. İnternetini kontrol et.')});
}
function starUnlock(k){
  if(starBusy)return;starBusy=true;var d=DEF[k];toast('Ödeme ekranı hazırlanıyor...');
  function end(){starBusy=false}
  starPost('/api/invoice',{initData:TGW.initData,item:k}).then(function(r){
    if(r.status===409){starSync().then(function(){end();if(SRV.unl[k])buyAnimalDo(k)});return}
    if(r.status!==200||!r.j||!r.j.link){end();toast('Satın alma şu an kullanılamıyor.'+errTag(r));SND.err();return}
    TGW.openInvoice(r.j.link,function(st){
      if(st==='paid'){var n=0;toast('Ödeme alındı...');
        (function poll(){starSync().then(function(){
          if(SRV.unl[k]){end();if(G.coins>=aCost(d)&&cnt(k)<d.max)buyAnimalDo(k);else toast('Yıldız ödendi! Altının yetince '+d.name+' alabilirsin.')}
          else if(++n>=10){end();toast('Ödeme alındı ama henüz görünmedi. Biraz sonra tekrar dene.')}
          else setTimeout(poll,1500)})})();
      }else{end();toast(st==='cancelled'?'Ödeme iptal edildi.':st==='failed'?'Ödeme başarısız oldu.':'Ödeme bekleniyor...')}
    });
  }).catch(function(){end();toast('Bağlantı hatası. İnternetini kontrol et.')});
}
function buyAnimalDo(k){
  var d=DEF[k],n=cnt(k);if(n>=d.max)return;
  var c=aCost(d);if(G.coins<c){toast('Yetersiz altın: '+fmtN(c)+' gerekli.');SND.err();return}
  G.coins-=c;G.an[k]=n+1;syncAnimals();SND.buy();
  var an=animals.filter(function(a){return a.k===k&&a.i===n})[0]||animals.filter(function(a){return a.k===k}).pop();burst(an.x,an.y-10,18,['#ffe27a','#fff','#ff9ec0'],70);an.dance=7.4;an.dnc=0;SND.party();
  toast(d.name+' senin! '+d.tip);setTimeout(function(){animalSound(k)},350);save();
}
function tapWorld(x,y){
  if(tapPlay(x,y))return;
  var kx=(x-KP.x)/(KP.rx*1.05),ky=(y-KP.y)/(KP.ry*1.2);
  if(kx*kx+ky*ky<1){SND.splash();burst(x,y,10,['#bfefff','#ffffff','#7fd3ee'],50);ripples.push({x:x,y:y,t:0,k:1});return}
  if(x>=426&&x<=462&&y>=84&&y<=164){SND.splash();burst(438,156,14,['#bfefff','#ffffff','#7fd3ee'],60);popup(438,76,'Şıırr!','#bfefff');return}
  var PD=POND,pdx=(x-PD.x)/(PD.rx*1.1),pdy=(y-PD.y)/(PD.ry*1.1);
  if(pdx*pdx+pdy*pdy<1){SND.splash();burst(x,y,10,['#bfefff','#ffffff','#7fd3ee'],50);ripples.push({x:x,y:y,t:0});return}
  if(Math.abs(x-246)<26&&y>366&&y<416){SND.splash();burst(246,386,10,['#bfefff','#ffffff','#7fd3ee'],50);popup(246,356,'Şlap!','#bfefff');return}
  // yumurta / yün

function b64u(sx){sx=sx.replace(/-/g,'+').replace(/_/g,'/');while(sx.length%4)sx+='=';var b=atob(sx),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function checkCode(code,slot){
  return Promise.resolve().then(function(){
    return PUBK||crypto.subtle.importKey('jwk',PUBJ,{name:'ECDSA',namedCurve:'P-256'},false,['verify']).then(function(k){PUBK=k;return k})
  }).then(function(k){return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,b64u(code),new TextEncoder().encode('CV1|'+PAY.pid+'|'+slot))}).catch(function(){return false});
}
var redeeming=false;
function redeemCode(raw){
  var code=(raw||'').replace(/\s+/g,'');
  if(!code){hMsg('Önce kodu yapıştır.',false);return}
  if(redeeming)return;
  if(PAY.paid.some(function(x){return x.c===code})){hMsg('Bu kod zaten kullanıldı.',false);return}
  if(G.farmers>=MAXF){hMsg('Tarla dolu. Kodun saklı, yer açılınca kullanabilirsin.',false);return}
  var used={};PAY.paid.forEach(function(x){used[x.s]=1});
  var slots=[1,2,3].filter(function(x){return !used[x]});
  if(!slots.length){hMsg('Bu hesapta tüm ödemeli çiftçiler alındı.',false);return}
  if(!(window.crypto&&crypto.subtle)){hMsg('Bu tarayıcı kod doğrulamayı desteklemiyor. Oyunu güncel bir tarayıcıda aç.',false);return}
  redeeming=true;hMsg('Kod kontrol ediliyor...',true);
  var i=0;
  (function next(){
    if(i>=slots.length){redeeming=false;hMsg('Kod bu hesap için geçerli değil. Kimliği ve kodu kontrol et.',false);SND.err();return}
    var sl=slots[i++];
    checkCode(code,sl).then(function(ok){
      if(!ok){next();return}
      redeeming=false;PAY.paid.push({s:sl,c:code});savePay();G.farmers++;syncFarmers();save();SND.buy();
      var f=farmers[farmers.length-1];if(f)burst(f.x,f.y-14,18,['#ffe27a','#fff','#a6f070'],70);

    });
  })();
}

  function loop(now){
    var dt=Math.min(.05,(now-last)/1000);last=now;
    requestAnimationFrame(loop);
    if(ready){try{update(dt);frameDraw(T,dt)}catch(e){try{ctx.restore();ctx.restore()}catch(e2){}}}
  }
  requestAnimationFrame(loop);
  document.addEventListener('visibilitychange',function(){if(document.hidden){save();try{if(AC&&AC.state==='running')AC.suspend()}catch(e){}}else{offlineApply();if(AC)actx()}});
  window.addEventListener('pagehide',save);
}
if(document.fonts&&document.fonts.load){Promise.race([document.fonts.load('20px "Lilita One"'),new Promise(function(r){setTimeout(r,1200)})]).then(init,init)}else init();
})();
</script>
